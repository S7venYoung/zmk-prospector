---
include:
  # Receiver build with the Codex-first dashboard, shared touch settings, token unit visibility, and coordinate-based horizontal swipes (v18; receiver-only matrix, condition icons and Chinese date).
  - board: xiao_ble//zmk
    shield: eyelash_sofle_prospector_dongle prospector_adapter prospector_theme_codex_status
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_sofle_prospector_dongle
  # Standalone WALL-E dashboard build; keeps the Codex data dashboard intact.
  - board: xiao_ble//zmk
    shield: eyelash_sofle_prospector_dongle prospector_adapter prospector_theme_walle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_sofle_prospector_dongle_walle
  # Weather Clock dashboard: time/weather from the native companion, plus local keyboard state.
  - board: xiao_ble//zmk
    shield: eyelash_sofle_prospector_dongle prospector_adapter prospector_theme_weather_clock
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_sofle_prospector_dongle_weather_clock
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset_xiao_ble
