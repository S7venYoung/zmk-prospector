# Enable ZMK Display and LVGL for UI
CONFIG_DISPLAY=y
CONFIG_ZMK_DISPLAY=y
CONFIG_LVGL=y

# Using ZMK BUILT_IN screen (like display_test) - NOT CUSTOM
# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# CONFIG_LV_Z_MEM_POOL_SIZE=49152
# CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_Z_MEM_POOL_SIZE=24576
 
# Main thread stack - increased for LVGL 9 (matches minimal-test)
CONFIG_MAIN_STACK_SIZE=4096

# Layout engine - required for LVGL 9
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y
# CONFIG_LV_FONT_MONTSERRAT_40=y

# DISABLED FOR MINIMAL BOOT TEST:
# CONFIG_PROSPECTOR_MULTI_KEYBOARD=y


# Enable SPI for display communication
CONFIG_SPI=y

# Enable GPIO for hardware control
CONFIG_GPIO=y

# ZMK Studio DISABLED for minimal test
CONFIG_ZMK_STUDIO=n

# Power management DISABLED
CONFIG_PM_DEVICE=n

# LED subsystem DISABLED
CONFIG_LED=n

# Logging configuration (enable for debugging)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=4
CONFIG_ZMK_LOG_LEVEL_DBG=y

# Fault dump for crash debugging
CONFIG_FAULT_DUMP=2
CONFIG_EXTRA_EXCEPTION_INFO=y

# Disable split keyboard features (this is a scanner, not keyboard)
# CONFIG_ZMK_SPLIT=n

# ========== Step 5: I2C/Touch/Sensor ==========
# I2C bus for touch and sensor
CONFIG_I2C=n

# 触摸屏（CST816S）相关的代码已随原 CONFIG_PROSPECTOR_TOUCH_ENABLED 整体移除，
# 输入子系统也一并关掉。
CONFIG_INPUT=n
CONFIG_INPUT_CST816S=n
CONFIG_INPUT_CST816S_INTERRUPT=n

# Light sensor (APDS9960) - for auto-brightness
CONFIG_SENSOR=n
CONFIG_APDS9960=n
CONFIG_APDS9960_TRIGGER_NONE=y
# Thread names so the crash-recovery handler can report the faulting thread
CONFIG_THREAD_NAME=y

# Software watchdog: pure software mode (no nRF hardware WDT - it would keep
# running across the soft reset into the UF2 bootloader and reset mid-update)
CONFIG_TASK_WDT_HW_FALLBACK=n



# ============== Display Configuration ==============
CONFIG_ZMK_DISPLAY=y
CONFIG_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y


# ============== 刷新丝滑度 ==============
# LVGL 默认刷新周期 33ms，等于"屏上内容变了"最多要等 33ms 才被画出去，
# 叠上日志页定时器（原来 100ms）和 20MHz SPI 的一帧 ~54ms，
# 一次滚动要 150ms 上下，所以看着发顿。这里压到 16ms。
# 没有 invalidate 时 LVGL 不会真的重绘，所以只是让"有变化时"更快落地。
CONFIG_LV_DEF_REFR_PERIOD=16

# Reduce screen flickering with double buffering
CONFIG_LV_Z_DOUBLE_VDB=n
# CONFIG_LV_Z_VDB_SIZE=30
CONFIG_LV_Z_VDB_SIZE=20

# Display thread stack
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=16384
# CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192
#必须4096 否则会花屏
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# FPU context sharing between threads (prevents FPU register corruption on context switch)
CONFIG_FPU_SHARING=y

# GPIO for backlight
CONFIG_GPIO=y

# ============== LVGL Widgets ==============
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_CANVAS=n
CONFIG_LV_USE_IMAGE=n

# 原触摸专属的设置页（Display Settings / Quick Actions / Keyboard Select）已随触摸
# 代码一起删除（见 custom_status_screen.c / system_settings_widget.c），slider /
# switch / button 都不会再被用到，保持关闭以省 flash。
CONFIG_LV_USE_SLIDER=n
CONFIG_LV_USE_SWITCH=n
CONFIG_LV_USE_BUTTON=n

# ============== Fonts ==============
CONFIG_LV_FONT_MONTSERRAT_12=n
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_20=y
# 日志页自带字体 qf_font_log_10x16（10px 宽 / 16px 高，见 qf_display_log_lvfont.c），
# 它取代了原来的 lv_font_unscii_8 —— unscii_8 只有 8x9，在这块屏上太小看不清。
# 这里保留 unscii_8 是因为它仍是 LVGL 的候选默认字体，别的页可能还引用它。
CONFIG_LV_FONT_UNSCII_8=y
# 别开 unscii_16：它是 16px 全宽字体，一行只放得下 17 个字符。
CONFIG_LV_FONT_UNSCII_16=n

# 日志页要铺满 280x240 面板：28 字符 x 10px = 280px 宽，15 行 x 16px = 240px 高
# （对应 qf_font_log_10x16 的 10px 字宽 / 16px 行高）。
CONFIG_PROSPECTOR_DISPLAY_LOG_MAX_COLS=28
CONFIG_PROSPECTOR_DISPLAY_LOG_LINES=15

# Layer slide animation (default: disabled)
# To enable slide animation by default: CONFIG_PROSPECTOR_LAYER_SLIDE_DEFAULT=y

# ============== PWM Backlight ==============
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y

# Stack overflow detection (writes sentinel at stack bottom, checks on context switch)
# CONFIG_STACK_SENTINEL=y

# ============== Disable Optional Features ==============
# CONFIG_ZMK_SPLIT=n
CONFIG_ZMK_STUDIO=n
CONFIG_PM_DEVICE=n

# Light sensor disabled by default
# To enable: CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=y
# CONFIG_I2C=y
CONFIG_PROSPECTOR_DEFAULT_LAYOUT=4

# CONFIG_PROSPECTOR_DEMO_MODE=y
CONFIG_PROSPECTOR_MODE_SCANNER=y
# CONFIG_ZMK_BLE=n
CONFIG_PROSPECTOR_MAX_KEYBOARDS=3


CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
