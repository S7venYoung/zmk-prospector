name: Build ZMK firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-22.04
    outputs:
      build_matrix: ${{ env.build_matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Read build matrix
        run: echo "build_matrix=$(yq -oj -I0 build.yaml)" >> "$GITHUB_ENV"

  build:
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build
        shell: sh
        run: |
          echo "build_dir=$(mktemp -d)" >> "$GITHUB_ENV"
          if [ -n "${{ matrix.snippet }}" ]; then
            echo 'extra_west_args=-S "${{ matrix.snippet }}"' >> "$GITHUB_ENV"
          fi
          echo 'artifact_name=${{ matrix.artifact-name || format('{0}-{1}-zmk', matrix.shield, matrix.board) }}' >> "$GITHUB_ENV"
      - name: Initialize dependencies
        run: |
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export
      - name: Apply DYA compatibility to Prospector central
        if: contains(matrix.shield, 'prospector_adapter')
        run: |
          cp zmk/app/src/split/bluetooth/central.c modules/prospector-zmk-module/src/split/bluetooth/central.c
          patch modules/prospector-zmk-module/src/split/bluetooth/central.c patches/prospector-dya-central.patch
      - name: Build
        shell: sh -x {0}
        run: west build -s zmk/app -d "${{ env.build_dir }}" -b "${{ matrix.board }}" ${{ env.extra_west_args }} -- -DZMK_CONFIG="$GITHUB_WORKSPACE/config" -DSHIELD="${{ matrix.shield }}" ${{ matrix.cmake-args }}
      - name: Collect artifact
        run: |
          mkdir "${{ env.build_dir }}/artifacts"
          if [ -f "${{ env.build_dir }}/zephyr/zmk.uf2" ]; then
            cp "${{ env.build_dir }}/zephyr/zmk.uf2" "${{ env.build_dir }}/artifacts/${{ env.artifact_name }}.uf2"
          else
            cp "${{ env.build_dir }}/zephyr/zmk.bin" "${{ env.build_dir }}/artifacts/${{ env.artifact_name }}.bin"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ env.artifact_name }}
          path: ${{ env.build_dir }}/artifacts

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: firmware
          pattern: artifact-*
          delete-merged: true
