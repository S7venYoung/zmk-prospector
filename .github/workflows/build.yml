name: Build ms2 nine-theme scanner (manual only)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
        with:
          path: zmk-prospector
      - name: Initialize west manifest
        run: west init -l zmk-prospector
      - uses: actions/cache/restore@v4
        id: deps
        with:
          path: |
            zmk
            zephyr
            modules
            prospector-zmk-module
            zmk-feature-*
            zmk-module-*
            zmk-behavior-*
            zmk-stdlib
          key: ms2-dya-v1-${{ runner.os }}-${{ hashFiles('zmk-prospector/west.yml') }}
      - name: Initialize pinned DYA workspace
        run: |
          west update --narrow --fetch-opt=--depth=1
          west zephyr-export
      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            zmk
            zephyr
            modules
            prospector-zmk-module
            zmk-feature-*
            zmk-module-*
            zmk-behavior-*
            zmk-stdlib
          key: ms2-dya-v1-${{ runner.os }}-${{ hashFiles('zmk-prospector/west.yml') }}
      - name: Build kblade ms2 scanner with nine runtime themes
        run: bash zmk-prospector/scripts/build-ms2-scanner.sh "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: kblade_ms2_scanner_nine_themes
          path: |
            build-ms2-scanner/zephyr/zmk.uf2
            build-ms2-scanner/zephyr/zmk.elf
            build-ms2-scanner/zephyr/.config
          if-no-files-found: error
          include-hidden-files: true
